        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function (char) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
            });
        }
        // 仅实现本页面需要的弹窗功能，无外部依赖。
        var Swal = { fire: function (options) {
            if (typeof options === 'string') options = {title: options};
            return new Promise(function (resolve) {
                var dialog = document.getElementById('order-dialog');
                var title = document.getElementById('dialog-title');
                var body = document.getElementById('dialog-content');
                var confirm = document.getElementById('dialog-confirm');
                var cancel = document.getElementById('dialog-cancel');
                title.textContent = options.title || '';
                body.innerHTML = options.html || '';
                confirm.textContent = options.confirmButtonText || '确定';
                cancel.textContent = options.cancelButtonText || '取消';
                cancel.hidden = !options.showCancelButton;
                cancel.style.display = options.showCancelButton ? '' : 'none';
                var finished = false;
                function finish(ok) {
                    if (finished) return;
                    finished = true;
                    dialog.close();
                    resolve({isConfirmed: ok});
                }
                confirm.onclick = function () { finish(true); };
                cancel.onclick = function () { finish(false); };
                dialog.oncancel = function (event) { event.preventDefault(); finish(false); };
                if (typeof dialog.showModal === 'function') dialog.showModal();
                else resolve({isConfirmed: options.showCancelButton ? window.confirm(title.textContent + '\n' + body.textContent) : (window.alert(title.textContent), false)});
            });
        }};

            var visual = productVisuals[selectedProduct] || {label:'商品',color:'#5374e4',image:''};
            var defaultIcon = productIcon(visual);
            var priceText = data.price.replace(/^价格[：:]\s*/, '');
            var categoryName = categorySelect.options[categorySelect.selectedIndex].text;
            panel.innerHTML = `
                <div class="product-summary">
                    <img class="product-cover" width="76" height="76" alt="${escapeHTML(selectedProduct)}商品标识" decoding="async" referrerpolicy="no-referrer">
                    <div class="product-heading">
                        <span class="product-eyebrow">${escapeHTML(categoryName)}</span>
                        <h4 class="product-name">${escapeHTML(selectedProduct)}</h4>
                        <span class="product-price">${escapeHTML(priceText)}<small>商品价格</small></span>
                    </div>
                </div>
                <div class="product-info">
                    <h5 class="product-section-title">商品说明</h5>
                    <div class="product-copy">${data.description}</div>
                </div>`;
            var cover = panel.querySelector('.product-cover');
            cover.addEventListener('error', function () {
                if (cover.getAttribute('src') !== defaultIcon) cover.src = defaultIcon;
            });
            cover.src = visual.image || defaultIcon;
            if (visual.tutorial) {
                var details = document.createElement('details');
                details.className = 'product-tutorial';
                details.innerHTML = '<summary>查看 App Store 登录教程</summary><div class="tutorial-body"></div>';
                // 打开教程后才创建图片，未打开时不会请求大图。
                details.addEventListener('toggle', function () {
                    if (!details.open || details.dataset.loaded) return;
                    details.dataset.loaded = 'true';
                    var body = details.querySelector('.tutorial-body');
                    var link = document.createElement('a');
                    link.className = 'tutorial-link'; link.href = visual.tutorial;
                    link.target = '_blank'; link.rel = 'noopener noreferrer';
                    var image = document.createElement('img');
                    image.alt = '苹果应用商店登录教程'; image.decoding = 'async'; image.referrerPolicy = 'no-referrer';
                    image.addEventListener('error', function () {
                        image.hidden = true;
                        var message = document.createElement('p'); message.className = 'tutorial-error';
                        message.textContent = '教程图片暂时加载失败，可点击下方链接查看原图。';
                        body.prepend(message);
                    }, {once:true});
                    var caption = document.createElement('span'); caption.className = 'tutorial-caption';
                    caption.textContent = '点击查看教程原图';
                    link.appendChild(image); link.appendChild(caption); body.appendChild(link);
                    image.src = visual.tutorial;
                });
                panel.querySelector('.product-info').appendChild(details);
            }
            panel.querySelectorAll('a[target="_blank"]').forEach(function (a) { a.rel = 'noopener noreferrer'; });
        }

        // 监听商品分类选择改变事件
        var categorySelect = document.getElementById("category");
        var productSelect = document.getElementById("product");
        categorySelect.addEventListener("change", function () {
            initProductSelect(); // 更新商品选择框
            updateProductDescription(); // 更新商品介绍
        });

        // 商品选择框改变事件
        productSelect.addEventListener("change", function () {

        });

// 监听确认订单按钮点击事件
var confirmButton = document.getElementById("confirm-button");
confirmButton.addEventListener("click", function () {
    var selectedProduct = productSelect.options[productSelect.selectedIndex].text;
    var userEmail = document.getElementById("email").value.trim();
    var selectedPayment = document.querySelector('input[name="payment"]:checked');

    if (selectedProduct && userEmail && selectedPayment) {
        // 获取商品价格
        var productPrice = getProductPrice(selectedProduct);
        
        // 生成随机订单编号
        var orderNumber = generateOrderNumber();

        // 根据用户选择的支付方式生成带商品参数和价格的支付链接
        var paymentMethod = selectedPayment.value;
        var paymentUrl = "";
        if (paymentMethod === "wechat") {
            // 拼接支付链接，将商品参数和价格传递给wxpay.php
            paymentUrl = "wxpay.html?" + new URLSearchParams({product:selectedProduct, price:productPrice, email:userEmail}).toString();
        } else if (paymentMethod === "alipay") {
            // 拼接支付链接，将商品参数和价格传递给alipay.php
            paymentUrl = "alipay.html?" + new URLSearchParams({product:selectedProduct, price:productPrice, email:userEmail}).toString();
        }

        // 使用本地轻量弹窗显示订单信息，包括订单编号和支付链接
        Swal.fire({
            title: '确认订单',
            html: `<p>订单编号：${orderNumber}</p><p>商品：${escapeHTML(selectedProduct)}</p><p>${productPrice}</p><p>邮箱：${escapeHTML(userEmail)}</p><p>支付方式：${selectedPayment.value}</p>`,
            icon: 'info',
            showCancelButton: true,
            confirmButtonText: '立即支付',
            cancelButtonText: '取消',
        }).then((result) => {
            if (result.isConfirmed) {
                // 在用户确认支付后，打开带商品参数和价格的支付链接
                window.open(paymentUrl, "_blank", "noopener,noreferrer");
            }
        });
    } else {
        Swal.fire('请完整填写订单信息', '', 'error');
    }
});

// 获取商品价格的函数
function getProductPrice(productName) {
    // 在这里根据商品名称获取商品价格，可以从 productDescriptions 对象中查找
    if (productDescriptions[productName]) {
        return productDescriptions[productName].price;
    } else {
        return "未知价格";
    }
}

        // 生成随机订单编号的函数
        function generateOrderNumber() {
            // 在这里添加生成订单编号的逻辑，例如使用时间戳和随机数的组合
            var timestamp = Date.now();
            var randomNum = Math.floor(Math.random() * 10000);
            return `ORDER-${timestamp}-${randomNum}`;
        }
