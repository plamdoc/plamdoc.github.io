<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1677ff">
  <title>安全支付</title>
  <!-- 页面样式内联，不依赖外部 CSS、图标字体或 JavaScript 库。 -->
  <link rel="preconnect" href="https://p.ananas.chaoxing.com" crossorigin>
  <style>
    :root{--green:#1677ff;--ink:#22334b;--muted:#7b8799;--line:#e5ecf5;--soft:#edf5ff}
    *{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:var(--ink);font:14px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #a3c9ff;outline-offset:4px}button{cursor:pointer}a{color:var(--green)}
    .body{max-width:500px;margin:40px auto 0;padding:0 18px}.mod-title{display:flex;justify-content:center;align-items:center;gap:10px;font-size:23px;margin:0 0 22px;font-weight:700}.brand-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--green);color:white}.brand-icon svg{width:25px;height:25px}
    .mod-ct{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 16px 50px #23436a0a}.order{padding:14px;text-align:center;background:#f8fbff;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:1px;color:#6b7f99}.amount{text-align:center;padding:22px 16px 16px}.amount-label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}.price-value{font-size:42px;line-height:1.25;font-weight:750;letter-spacing:-1px;font-variant-numeric:tabular-nums}.currency{font-size:25px;vertical-align:5px;margin-right:3px}.product-name{color:var(--muted);font-size:13px;text-align:center;margin:0 20px 18px;overflow-wrap:anywhere}
    .qrcode-img-wrapper{text-align:center}.qrcode-img-area{position:relative;display:inline-block;padding:12px;background:white;border:1px solid var(--line);border-radius:16px}.qrcode-img-area img{display:block;width:250px;height:250px;max-width:100%;object-fit:contain}.ui-loading{position:absolute;inset:0;background:#ffffffed;display:grid;place-items:center;border-radius:15px;color:var(--muted)}.qr-error{max-width:274px;margin:10px auto;color:#a05226;font-size:12px;text-align:center}.qr-error button{border:0;background:none;color:var(--green);text-decoration:underline}
    .time-item{text-align:center}.notice{max-width:390px;margin:20px auto 0;padding:0 22px}.notice h2{margin:0;font-size:13px;color:#a56c22;font-weight:500;line-height:1.9}.notice b{color:#a15024}.countdown-label{margin:16px 0 8px;color:var(--muted);font-size:12px}.countdown{display:flex;justify-content:center;align-items:center;gap:8px}.countdown strong{min-width:66px;border:1px solid #dce9fc;background:var(--soft);border-radius:9px;color:#2169c2;font-size:17px;font-weight:650;line-height:38px;font-variant-numeric:tabular-nums}.tip{display:flex;justify-content:center;align-items:center;gap:11px;margin:22px auto;color:#64758d}.ico-scan svg{width:28px;height:28px;display:block;color:var(--green)}.tip-text p{margin:0;font-size:12px}.tip-text p:first-child{font-size:14px;color:var(--ink)}
    .detail{border-top:1px dashed var(--line);padding:0 22px}.detail-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 0;border:0;background:none;color:#718099;font-size:13px}.detail-toggle svg{width:16px;height:16px;transition:transform .15s}.detail-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}.detail-ct{margin:0;padding:0 0 18px;display:grid;grid-template-columns:95px minmax(0,1fr);gap:9px 12px;font-size:12px}.detail-ct dt{color:var(--muted)}.detail-ct dd{margin:0;text-align:right;overflow-wrap:anywhere}.status{color:var(--green)}
    .foot{text-align:center;color:#8b95a5;font-size:12px;margin:20px 0 28px}.foot p{margin:3px 0}.foot .disclaimer{margin-top:13px;font-size:11px;color:#a0a9b6}.copyRight{text-align:center}.copybtn{text-align:center}.btn{display:inline-block;border:1px solid #cfe1fc;background:#edf5ff;color:#1768c8;border-radius:8px;padding:7px 14px;text-decoration:none;font-size:12px}.audio-control{text-align:center;margin:10px 0 16px}.audio-control[hidden], [hidden]{display:none!important}
    #timeOut{padding:42px 24px;color:#a15b2c}.expired-symbol{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 18px;background:#fff2e8;border-radius:50%;font-size:28px}#timeOut h2{margin:0 0 8px;font-size:20px}#timeOut p{font-size:13px;color:var(--muted);margin:0 0 20px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90vw;padding:10px 17px;border-radius:9px;background:#20324b;color:#fff;font-size:13px;z-index:1000;text-align:center}
    @media(max-width:540px){.body{margin-top:24px;padding:0 14px}.mod-title{font-size:21px;margin-bottom:18px}.mod-ct{border-radius:18px}.price-value{font-size:39px}.notice{padding:0 16px}.foot{margin-bottom:24px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main class="body">
  <h1 class="mod-title"><span class="ico_log ico-1 brand-icon" aria-hidden="true"><span style="font-size:26px;font-weight:600;line-height:1">支</span></span>支付宝扫码支付</h1>
  <section class="mod-ct" aria-label="支付订单">
    <div class="order">确认金额后，请使用支付宝扫一扫</div>
    <div class="amount" id="timeOut" hidden>
      <div class="expired-symbol" aria-hidden="true">◷</div><h2>订单已过期</h2><p>请您重新发起支付，勿再扫描本页二维码付款。</p><a class="btn" href="https://plamdoc.github.io/faka/">重新发起支付</a>
    </div>
    <div id="orderbody">
      <div class="amount"><span id="copy_money"><span class="amount-label">订单金额</span><span class="price-value"><span class="currency">¥</span><span id="orderPrice">0.00</span></span></span></div>
      <p class="product-name" id="productSummary">商品名称</p>
      <!-- 沿用原版隐藏设置，若需要显示复制按钮，移除 hidden。 -->
      <div class="copybtn" hidden><button type="button" class="btn" id="copy_p">复制金额</button></div>
      <div class="qrcode-img-wrapper" data-role="qrPayImgWrapper">
        <div data-role="qrPayImg" class="qrcode-img-area">
          <div class="ui-loading qrcode-loading" id="qrLoading" data-role="qrPayImgLoading" hidden>二维码加载中…</div>
          <img alt="支付宝收款二维码" id="src" src="https://p.ananas.chaoxing.com/star3/origin/c5274ff908777046facb3b017915624e.png" width="250" height="250" fetchpriority="high" decoding="async">
        </div>
      </div>
      <p class="qr-error" id="qrError" hidden>二维码暂时加载失败，请检查网络后 <button type="button" id="retryQR">重新加载</button>。</p>
      <div class="time-item">
        <div class="notice" id="msg"><h2>请按商品金额付款，<b>不能多付或少付</b><br>请在规定时间内付款，失效请勿付款<br>支付未跳转，请点击右下角联系补发</h2></div>
        <p class="countdown-label">剩余支付时间</p>
        <div class="countdown" aria-label="剩余支付时间"><strong id="hour_show">0时</strong><strong id="minute_show">10分</strong><strong id="second_show">00秒</strong></div>
      </div>
      <div class="tip"><div class="ico-scan" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 12h18"/></svg></div><div class="tip-text"><p>请使用<span id="payType1">支付宝</span>扫一扫</p><p>扫描二维码完成支付</p></div></div>
      <div class="audio-control" id="audioControl" hidden><button type="button" class="btn" id="playVoice">播放语音提示</button></div>
      <div class="detail" id="orderDetail">
        <button type="button" class="arrow detail-toggle" id="detailToggle" aria-expanded="false" aria-controls="desc"><span>查看订单详情</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <dl class="detail-ct" id="desc" hidden><dt>商户订单号：</dt><dd id="orderId"></dd><dt>订单名称：</dt><dd id="orderName">商品名称</dd><dt>订单金额：</dt><dd>¥<span id="detailPrice">0.00</span></dd><dt>订单状态：</dt><dd class="status">待付款</dd></dl>
      </div>
    </div>
  </section>
  <footer class="foot"><p>手机用户可保存上方二维码到手机中</p><p>在扫一扫中选择“相册”即可</p><p class="disclaimer">如有纠纷与本平台无关</p></footer>
</main>
<div class="copyRight"></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
// 该静态页面与原版一样，仅展示收款码；不自行判断支付成功。
var myTimer = null;
var countdownDeadline = 0;
var toastTimer = null;
var voiceContent = null;
var QR_URL = 'https://p.ananas.chaoxing.com/star3/origin/c5274ff908777046facb3b017915624e.png';
var AUDIO_URL = 'css/yuyin.mp3';
function byId(id) { return document.getElementById(id); }
function toggleDesc() {
  var desc = byId('desc'); desc.hidden = !desc.hidden;
  byId('detailToggle').setAttribute('aria-expanded', String(!desc.hidden));
}
function generateOrderId() {
  // 保留原版按本地时间生成展示订单号的方式；这不是服务端订单。
  var now = new Date();
  var orderId = '' + now.getFullYear() + (now.getMonth() + 1) + now.getDate() + now.getHours() + now.getMinutes() + now.getSeconds();
  byId('orderId').textContent = orderId;
  return orderId;
}
function formatDate(now) { return new Date(now * 1000).toISOString().slice(0,19).replace('T',' '); }
function normalizePrice(value) {
  // 兼容原购买页传来的“价格：15元”，也兼容“15”或“15.00”。
  var raw = String(value || '').trim();
  var match = raw.match(/^(?:价格\s*[:：]\s*)?[¥￥]?\s*(\d+(?:\.\d{1,2})?)\s*元?$/);
  return match && Number.isFinite(Number(match[1])) ? Number(match[1]).toFixed(2) : (raw || '0.00');
}
function renderCountdown() {
  // 根据截止时间计算，减少后台标签页节流造成的累计误差。
  var remaining = Math.max(0, Math.ceil((countdownDeadline - Date.now()) / 1000));
  byId('hour_show').textContent = Math.floor(remaining / 3600) + '时';
  byId('minute_show').textContent = String(Math.floor(remaining % 3600 / 60)).padStart(2,'0') + '分';
  byId('second_show').textContent = String(remaining % 60).padStart(2,'0') + '秒';
  if (remaining === 0) qrcode_timeout();
}
function timer(intDiff) {
  clearInterval(myTimer);
  countdownDeadline = Date.now() + Math.max(0, Number(intDiff) || 0) * 1000;
  renderCountdown();
  if (countdownDeadline > Date.now()) myTimer = setInterval(renderCountdown,1000);
}
function qrcode_timeout() {
  clearInterval(myTimer); myTimer = null;
  // 原代码未声明 orderlst；仅在确实存在时清理，避免到期报错。
  if (typeof window.orderlst !== 'undefined') clearInterval(window.orderlst);
  byId('orderbody').hidden = true; byId('timeOut').hidden = false;
  byId('qrLoading').hidden = true;
  // 收款码保留在隐藏区域，避免无用的“过期图片”网络请求。
}
function showToast(message) {
  clearTimeout(toastTimer); byId('toast').textContent = message; byId('toast').hidden = false;
  toastTimer = setTimeout(function () { byId('toast').hidden = true; },2500);
}
function legacyCopy(text) {
  var input = document.createElement('textarea'); input.value = text;
  input.style.cssText = 'position:fixed;opacity:0;left:-9999px';
  document.body.appendChild(input); input.select();
  try { return document.execCommand('copy'); } finally { input.remove(); }
}
async function copyMoney() {
  var text = byId('orderPrice').textContent;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); }
      catch (error) { if (!legacyCopy(text)) throw error; }
    } else if (!legacyCopy(text)) throw new Error('Copy failed');
    showToast('金额已复制');
  } catch (error) { showToast('复制失败，请手动复制金额'); }
}
function speckText(str) {
  // 保留自动播放尝试；浏览器拦截时提供手动播放按钮。
  if (!voiceContent) { voiceContent = new Audio(AUDIO_URL); voiceContent.preload = 'none'; }
  byId('audioControl').hidden = false;
  try {
    var promise = voiceContent.play();
    if (promise && typeof promise.then === 'function') {
      promise.then(function () { byId('audioControl').hidden = true; })
        .catch(function () { byId('audioControl').hidden = false; });
    } else byId('audioControl').hidden = true;
  } catch (error) { byId('audioControl').hidden = false; }
}
// 表单信息不再等待图片或外部资源加载完毕。
var urlParams = new URLSearchParams(window.location.search);
var price = normalizePrice(urlParams.get('price'));
var product = urlParams.get('product') || '商品名称';
byId('orderPrice').textContent = price; byId('detailPrice').textContent = price;
byId('orderName').textContent = product; byId('productSummary').textContent = product;
generateOrderId();
byId('detailToggle').addEventListener('click',toggleDesc);
byId('copy_p').addEventListener('click',copyMoney);
byId('playVoice').addEventListener('click',function () { speckText(0); });
var qr = byId('src');
function qrLoaded() { byId('qrLoading').hidden = true; byId('qrError').hidden = false; if (qr.naturalWidth > 0) byId('qrError').hidden = true; }
qr.addEventListener('load',qrLoaded);
qr.addEventListener('error',function () { byId('qrLoading').hidden = true; byId('qrError').hidden = false; });
if (qr.complete) qrLoaded(); else byId('qrLoading').hidden = false;
byId('retryQR').addEventListener('click',function () { byId('qrError').hidden = true; byId('qrLoading').hidden = false; qr.src = QR_URL; });
timer(10 * 60);
document.addEventListener('visibilitychange',function () { if (!document.hidden) renderCountdown(); });
window.addEventListener('pageshow',function () { renderCountdown(); });
// 语音仅在页面首帧绘制后尝试，优先显示订单与二维码。
requestAnimationFrame(function () { setTimeout(function () { speckText(0); },0); });

// 保留原版客服与广告脚本，在首屏完成后延迟加载；不阻塞金额/倒计时。
window.$crisp = window.$crisp || [];
window.CRISP_WEBSITE_ID = '003dd431-bacc-438f-b57a-5ec2dc030618';
function loadThirdParty() {
  if (!byId('crisp-loader')) {
    var chat = document.createElement('script'); chat.id = 'crisp-loader'; chat.src = 'https://client.crisp.chat/l.js'; chat.async = true;
    document.head.appendChild(chat);
  }
  if (!byId('ads-loader')) {
    var ads = document.createElement('script'); ads.id = 'ads-loader'; ads.async = true; ads.crossOrigin = 'anonymous';
    ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-78';
    document.head.appendChild(ads);
  }
}
// 使用固定延迟，不依赖 window.onload，以免二维码下载缓慢拖延客服出现。
setTimeout(loadThirdParty,1800);
</script>
</body>
</html>
